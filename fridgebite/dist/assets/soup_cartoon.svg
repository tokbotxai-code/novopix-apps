<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <!-- Cozy warm kitchen background gradient -->
    <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6E9" />
      <stop offset="62%" stop-color="#F5E6CC" />
      <stop offset="100%" stop-color="#E8D2AE" />
    </linearGradient>

    <!-- Wooden tabletop gradient -->
    <linearGradient id="woodTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFB78C" />
      <stop offset="40%" stop-color="#D1A374" />
      <stop offset="100%" stop-color="#B98756" />
    </linearGradient>

    <!-- Neutral creamy-golden soup gradient (fits cream, broth, vegetable, or any soup) -->
    <radialGradient id="soupBroth" cx="48%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="55%" stop-color="#F7D988" />
      <stop offset="88%" stop-color="#E8BE5E" />
      <stop offset="100%" stop-color="#D6A645" />
    </radialGradient>

    <!-- Ceramic bowl body gradient (sage-mint & cream anime pottery) -->
    <linearGradient id="bowlBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78A890" />
      <stop offset="55%" stop-color="#558B71" />
      <stop offset="100%" stop-color="#3B6B54" />
    </linearGradient>

    <!-- Ceramic inner rim -->
    <linearGradient id="bowlInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#EDE2CE" />
    </linearGradient>

    <!-- Linen placemat gradient -->
    <linearGradient id="placemat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF3E6" />
      <stop offset="100%" stop-color="#EADBC2" />
    </linearGradient>

    <!-- Wooden spoon gradient -->
    <linearGradient id="spoonWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7BC8A" />
      <stop offset="100%" stop-color="#BD8752" />
    </linearGradient>

    <!-- Soft steam gradient -->
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#4A3219" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="310" fill="url(#bgWall)" />

  <!-- Subtle background kitchen tiles / window light in anime style -->
  <g opacity="0.35">
    <rect x="65" y="35" width="170" height="190" rx="14" fill="#FFFDF9" stroke="#D9C3A3" stroke-width="5" />
    <line x1="150" y1="35" x2="150" y2="225" stroke="#D9C3A3" stroke-width="5" />
    <line x1="65" y1="130" x2="235" y2="130" stroke="#D9C3A3" stroke-width="5" />
    <!-- Little herb pot on sill -->
    <rect x="115" y="175" width="46" height="38" rx="6" fill="#D48C6A" stroke="#7A4930" stroke-width="3.5" />
    <path d="M126 175 C115 152, 136 142, 138 168 C142 142, 162 152, 150 175 Z" fill="#77B27A" stroke="#3F6A42" stroke-width="3.5" stroke-linejoin="round" />
  </g>

  <!-- Hanging cozy kitchen towel on right -->
  <g opacity="0.45">
    <path d="M650 40 L725 55 L705 185 L625 168 Z" fill="#F2B8A2" stroke="#8C5843" stroke-width="4" stroke-linejoin="round" />
    <path d="M645 75 L720 90 M638 115 L713 130 M631 150 L707 165" stroke="#FFFDF8" stroke-width="4" opacity="0.7" />
    <circle cx="685" cy="42" r="8" fill="#8C5843" />
  </g>

  <!-- Wooden Table -->
  <rect x="0" y="295" width="800" height="225" fill="url(#woodTable)" />
  <line x1="0" y1="295" x2="800" y2="295" stroke="#5A391E" stroke-width="5" />

  <!-- Wood grain lines -->
  <path d="M0 345 Q220 335 450 348 T800 342" fill="none" stroke="#9F6D3E" stroke-width="2.5" opacity="0.45" />
  <path d="M0 415 Q310 428 590 410 T800 420" fill="none" stroke="#9F6D3E" stroke-width="2.5" opacity="0.4" />
  <path d="M0 475 Q180 465 510 482 T800 472" fill="none" stroke="#9F6D3E" stroke-width="2.5" opacity="0.35" />

  <!-- Woven Linen Placemat (Perspective Diamond/Rounded Rect) -->
  <g filter="url(#softShadow)">
    <path d="M220 335 L580 335 L665 455 L135 455 Z" rx="22" fill="url(#placemat)" stroke="#5A391E" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Placemat stitched border -->
    <path d="M232 347 L568 347 L640 443 L160 443 Z" fill="none" stroke="#C9B18B" stroke-width="2.5" stroke-dasharray="10 8" stroke-linejoin="round" />
  </g>

  <!-- Shadow directly under the bowl -->
  <ellipse cx="395" cy="402" rx="168" ry="38" fill="#4A2E14" opacity="0.28" />

  <!-- Left & Right Ceramic Bowl Side Handles -->
  <path d="M228 258 C182 252, 174 308, 238 318" fill="none" stroke="#5A391E" stroke-width="22" stroke-linecap="round" />
  <path d="M228 258 C182 252, 174 308, 238 318" fill="none" stroke="#6B9E85" stroke-width="13" stroke-linecap="round" />

  <path d="M562 258 C608 252, 616 308, 552 318" fill="none" stroke="#5A391E" stroke-width="22" stroke-linecap="round" />
  <path d="M562 258 C608 252, 616 308, 552 318" fill="none" stroke="#4D7E66" stroke-width="13" stroke-linecap="round" />

  <!-- Bowl Foot / Base Ring -->
  <path d="M312 375 C312 406, 478 406, 478 375 Z" fill="#E6D5B8" stroke="#5A391E" stroke-width="5" stroke-linejoin="round" />

  <!-- Main Ceramic Bowl Body -->
  <path d="M222 232 C220 352, 295 394, 395 394 C495 394, 570 352, 568 232 Z" fill="url(#bowlBody)" stroke="#5A391E" stroke-width="5.5" stroke-linejoin="round" />

  <!-- Decorative cream wave pattern around the bowl exterior -->
  <path d="M234 295 Q275 312 315 298 T395 302 T475 298 T556 295" fill="none" stroke="#F8EFE0" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <circle cx="275" cy="332" r="6" fill="#F8EFE0" opacity="0.75" />
  <circle cx="335" cy="342" r="7" fill="#F8EFE0" opacity="0.75" />
  <circle cx="395" cy="345" r="7" fill="#F8EFE0" opacity="0.75" />
  <circle cx="455" cy="342" r="7" fill="#F8EFE0" opacity="0.75" />
  <circle cx="515" cy="332" r="6" fill="#F8EFE0" opacity="0.75" />

  <!-- Glossy cartoon highlight on left side of bowl -->
  <path d="M250 265 C254 312, 278 345, 312 362" fill="none" stroke="#A7D1BC" stroke-width="9" stroke-linecap="round" opacity="0.55" />

  <!-- Ceramic Bowl Top Rim (Outer & Inner Ellipse) -->
  <ellipse cx="395" cy="232" rx="174" ry="64" fill="url(#bowlInner)" stroke="#5A391E" stroke-width="5.5" />

  <!-- Soup Liquid Surface (Neutral Creamy-Golden Broth) -->
  <ellipse cx="395" cy="238" rx="156" ry="52" fill="url(#soupBroth)" stroke="#B58532" stroke-width="3" />

  <!-- Creamy Swirl inside the soup (neutral culinary look) -->
  <path d="M310 236 C332 216, 412 212, 452 232 C482 246, 445 266, 392 262 C355 260, 342 244, 368 234 C388 227, 415 233, 410 244" fill="none" stroke="#FFFDF7" stroke-width="7.5" stroke-linecap="round" opacity="0.88" />

  <!-- Subtle glossy broth reflections & tiny herb garnish -->
  <ellipse cx="325" cy="222" rx="22" ry="6" transform="rotate(-10 325 222)" fill="#FFFFFF" opacity="0.55" />
  <circle cx="468" cy="248" r="5" fill="#FFF9E6" opacity="0.65" />
  <circle cx="302" cy="246" r="4" fill="#FFF9E6" opacity="0.65" />

  <!-- Small neutral herb leaf in center -->
  <g transform="translate(392, 234)">
    <path d="M0 0 C-14 -12, -24 2, -4 8 C-16 16, 2 22, 6 6 C22 12, 20 -8, 4 -2 Z" fill="#68A85B" stroke="#365E2E" stroke-width="2.8" stroke-linejoin="round" />
  </g>

  <!-- Wooden Ladle / Spoon resting beside the bowl on placemat -->
  <g transform="translate(475, 412) rotate(-16)">
    <ellipse cx="0" cy="4" rx="34" ry="16" fill="#5A391E" opacity="0.22" />
    <path d="M22 -4 L132 -12 C142 -13, 145 3, 132 4 L22 6 Z" fill="url(#spoonWood)" stroke="#5A391E" stroke-width="4.2" stroke-linejoin="round" />
    <ellipse cx="0" cy="0" rx="32" ry="15" fill="url(#spoonWood)" stroke="#5A391E" stroke-width="4.2" />
    <ellipse cx="-2" cy="1" rx="22" ry="9" fill="#B67E46" opacity="0.55" />
    <ellipse cx="-6" cy="-3" rx="10" ry="3.5" fill="#F7DFB9" opacity="0.6" />
  </g>

  <!-- Cartoon Fluffy Steam Clouds & Swirls Rising from the Soup -->
  <g>
    <!-- Center tall steam swirl -->
    <path d="M395 195 C365 162, 428 130, 392 92 C368 66, 405 38, 398 18" fill="none" stroke="url(#steamGrad)" stroke-width="18" stroke-linecap="round" />
    <!-- Left steam swirl -->
    <path d="M322 202 C295 174, 342 145, 312 112 C294 92, 318 68, 312 52" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Right steam swirl -->
    <path d="M468 202 C495 174, 448 145, 478 112 C496 92, 472 68, 478 52" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Cute subtle cartoon steam puffs -->
    <circle cx="348" cy="135" r="14" fill="#FFFFFF" opacity="0.32" />
    <circle cx="442" cy="122" r="16" fill="#FFFFFF" opacity="0.32" />
    <circle cx="396" cy="78" r="20" fill="#FFFFFF" opacity="0.25" />
  </g>
</svg>
