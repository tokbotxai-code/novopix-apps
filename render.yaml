services:
  - type: web
    name: novopix-scanner
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: public
      - key: AGENCY_API_URL
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: novopix-panel
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: agency
      - key: AGENCY_PIN
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
