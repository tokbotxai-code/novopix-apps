<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fikol: gra logiczna o małym robocie, który rozbił się na obcej planecie. 16 poziomów, śrubki, skrzynie, strażnicy, portale i bomby.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fikol">
<meta name="theme-color" content="#10161f">
<title>Fikol</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: playful retro arcade, a little robot on a mission
   IDEA: a handheld console — the board is the screen inside a moulded housing
   PICTURE: the live game board itself, characterful vector sprites
   COLOUR and TYPE: deep charcoal-blue metal, coral robot, bright brass screws; Press Start 2P + Inter
   LAYOUT: title strip, board, HUD, d-pad; stacked on phones */
:root{--cell:64px;color-scheme:dark;--bg:#10161f;--case:#1c2532;--edge:#2c3a4d;--ink:#e9eef5;--dim:#8da0b8;--coral:#ff6b4a;--brass:#ffcc3d;--cyan:#56d6e8}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#1a2433,var(--bg));color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:16px 'Press Start 2P',monospace;margin:0;color:var(--coral);letter-spacing:1px}
.btn{white-space:nowrap;font:600 14px Inter,sans-serif;color:var(--ink);background:var(--case);border:1px solid var(--edge);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.case{background:linear-gradient(#222d3c,#18202b);border:1px solid var(--edge);border-radius:22px;padding:10px;box-shadow:0 10px 30px #0008,inset 0 1px 0 #ffffff14}
.screen{position:relative;border-radius:12px;overflow:hidden;background:#0a0f16;aspect-ratio:1;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;font:10px 'Press Start 2P',monospace;color:var(--ink);padding:10px 2px 2px}
.it{display:flex;align-items:center;gap:3px;white-space:nowrap}
.ico{position:static;inset:auto;width:18px;height:18px;display:block;flex:none;image-rendering:pixelated}
.hud b{color:var(--brass);font-weight:400}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.pulse{display:inline-block;animation:pop .3s ease-out}
.hud .it:first-child b{color:var(--ink)}
.pad{flex:1;display:grid;place-items:end center;min-height:0;padding-top:14px}
.dpad{display:grid;grid-template-columns:repeat(3,var(--cell));grid-template-rows:repeat(3,var(--cell));gap:6px}
.dpad button{border:0;border-radius:16px;background:var(--case);color:var(--ink);font-size:24px;box-shadow:0 4px 0 #0a0e14,inset 0 1px 0 #ffffff18;cursor:pointer}
.dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0e14}
#fire{grid-column:2;grid-row:2;background:var(--coral);color:#10161f;font:700 14px Inter,sans-serif}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}
.over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;background:#0a0f16e6;text-align:center;padding:14px;overflow-y:auto}
.over>:first-child{margin-top:auto}.over>:last-child{margin-bottom:auto}
.over .x{position:absolute;top:6px;right:6px;width:44px;padding:0;font-size:18px}
.over.show{display:flex}
.over h2{font:15px/1.6 'Press Start 2P',monospace;margin:0;color:var(--brass)}
.over p{margin:0;color:var(--dim);font-size:15px;max-width:30ch}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:100%;max-width:290px}
.levels button{width:100%;padding:0;height:42px;border-radius:12px;border:1px solid var(--edge);background:var(--case);color:var(--ink);font:12px 'Press Start 2P',monospace;cursor:pointer}
.levels button:disabled{opacity:.35}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font:12px Inter,sans-serif;color:var(--dim);padding:6px 2px 0}
#undo{min-height:40px;padding:0 12px;font-size:13px}
.sub b{color:var(--ink);font-weight:600}
.sh{color:var(--cyan);font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts .btn{min-height:44px;font-size:13px}
.opts .btn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.opts .btn[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
.bip{color:var(--cyan)!important;font-size:14px!important;border-left:3px solid var(--cyan);padding-left:10px;text-align:left}
.stars{color:var(--brass);letter-spacing:2px;font-size:22px}
.levels button small{display:block;font:9px Inter,sans-serif;color:var(--brass);letter-spacing:0;margin-top:2px}
.kb{display:none}
@media(hover:hover) and (pointer:fine){.kb{display:inline}}
.tight .hint{display:none}
.tight{--cell:46px}
.hint{font-size:13px;color:var(--dim);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.levels button.done{border-color:var(--coral);color:var(--brass)}
.levels button.cur{outline:2px solid var(--cyan);outline-offset:2px}
.dpad button:focus-visible,.levels button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#muteBtn[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
@media(max-width:360px){.btn{padding:0 10px;font-size:13px}h1{font-size:13px}.hud{font-size:8px;letter-spacing:-.5px}.levels{gap:4px}.levels button{height:42px}.top>div{gap:6px!important}}
@media(max-height:760px){:root{--cell:54px}.hint{display:none}}
@media(max-height:620px){:root{--cell:46px}.app{gap:6px;padding-top:6px}.hud{padding-top:6px}}
@media(orientation:landscape) and (max-height:520px){:root{--cell:50px}.app{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);column-gap:16px;row-gap:6px;max-width:none;padding:6px 14px}.top{grid-column:1;grid-row:1}.case{grid-column:1;grid-row:2;align-self:start}.pad{grid-column:2;grid-row:1/3;align-self:center;padding-top:0}.hint{display:none}.sub{padding-top:2px}.hud{padding-top:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>FIKOL</h1>
    <div style="display:flex;gap:8px">
      <button class="btn" id="muteBtn" aria-label="Wycisz wszystko" aria-pressed="false">♪</button>
      <button class="btn" id="menuBtn">Poziomy</button>
      <button class="btn" id="resetBtn">↺ Od nowa</button>
    </div>
  </div>
  <div class="case">
    <div class="screen" id="screen">
      <canvas id="cv" role="img" aria-label="Plansza gry Fikol. Steruj strzałkami, WASD, padem lub przesunięciem palca."></canvas>
      <div class="over" id="over" role="dialog" aria-label="Okno gry"></div>
    </div>
    <div class="hud" role="group" aria-label="Stan gry">
      <span class="it"><b id="hScore">000000</b><span class="sr">Wynik</span></span>
      <span class="it"><canvas class="ico" data-s="screw" width="16" height="16" aria-hidden="true"></canvas><b id="hScr">00</b><span class="sr">śrubek zostało</span></span>
      <span class="it"><canvas class="ico" data-s="life" width="16" height="16" aria-hidden="true"></canvas><b id="hLife">05</b><span class="sr">żyć</span></span>
      <span class="it"><canvas class="ico" data-s="key" width="16" height="16" aria-hidden="true"></canvas><b id="hKey">00</b><span class="sr">kluczy</span></span>
      <span class="it"><canvas class="ico" data-s="ammo" width="16" height="16" aria-hidden="true"></canvas><b id="hAmmo">00</b><span class="sr">amunicji</span></span>
      <span class="it"><canvas class="ico" data-s="level" width="16" height="16" aria-hidden="true"></canvas><b id="hLvl">01</b><span class="sr">poziom</span></span>
    </div>
    <div class="sub"><button class="btn" id="undo" aria-label="Cofnij ruch (Z)">↶ Cofnij</button><span>Ruchy <b id="hMv">0</b><span id="hSh" class="sh"></span></span><span id="hBest">Rekord: –</span></div>
  </div>
  <div class="pad">
    <div class="dpad">
      <button class="u" data-d="0,-1" aria-label="Góra">▲</button>
      <button id="fire" aria-label="PIF, strzał">PIF</button>
      <button class="l" data-d="-1,0" aria-label="Lewo">◀</button>
      <button class="r" data-d="1,0" aria-label="Prawo">▶</button>
      <button class="d" data-d="0,1" aria-label="Dół">▼</button>
    </div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
  <p class="hint">Przesuń palcem albo użyj pada (można przytrzymać). PIF strzela w kierunku ostatniego ruchu.<span class="kb"> Klawiatura: strzałki lub WASD, spacja strzela, Z cofa ruch, R zaczyna od nowa, Esc to mapa poziomów.</span></p>
</main>

function musicBar(c,o,t,th,bar){
  const sp=60/th.tempo/4,ch=th.prog[bar%4],sec=Math.floor(bar/4)%2,rnd=lcg(th.root*131+sec*977+(bar%4)*31+1);
  const sc=th.sc,note=p=>th.root+12+Math.floor(p/5)*12+sc[p%5];
  let pos=4;
  for(let i=0;i<16;i++){const at=t+i*sp;
    if(i===0||i===8||(sec&&i===14))tone(c,o,at,mhz(th.root+ch)*.5,mhz(th.root+ch)*.35,.14,'sine',.5);
    if(i===4||i===12)noise(c,o,at,.1,.1,'bandpass',1800,900);
    if(i%2===0)noise(c,o,at,.03,.035,'highpass',6000);
    if(i%2===0)tone(c,o,at,mhz(th.root+ch+12+[0,7,12,7][(i/2)%4]),null,sp*1.6,'square',.05);
    if([0,6,8,sec?11:14].includes(i))tone(c,o,at,mhz(th.root+ch-12),null,sp*2.2,'triangle',.3);
    if([0,3,6,8,10,12,14].includes(i)&&rnd()<.7){pos=Math.max(0,Math.min(9,pos+(rnd()<.5?1:-1)*(1+(rnd()<.3?1:0))));tone(c,o,at,mhz(note(pos)),null,sp*(rnd()<.4?2.4:1.5),'square',.07)}
  }
  return 16*sp;
}
