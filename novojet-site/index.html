 const s=gen,nearB=spawn&&sec>=SECLEN-40;

 });

 }

}
let acc=0,last=0;

 tick++;

 else{engine(false);off+=1.2;while(off>=RH){off-=RH;rows.unshift(mkRow(false));rows.pop()}parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});parts=parts.filter(q=>q.l>0);if(state==='over'&&pause>0)pause--}
}
